description: >-
  Open a dispute against one invoice on the verified account, or read back the
  disputes already on it. Opening one puts that invoice on hold while somebody
  reviews it, and takes off any promise made against it. It records what the
  caller says; it does not agree with them and it credits nothing. The account
  comes from verification and is never supplied or guessed by you.

input:
  type: object
  properties:
    action:
      type: string
      enum:
        - open
        - list
      description: >-
        open records a new dispute and puts the invoice on hold. list reads back
        what is already on the account and changes nothing.
    invoice_number:
      type: string
      description: >-
        The one invoice being challenged, spoken in any shape. A dispute is
        always against a single invoice. Send an empty string for list.
    reason_code:
      type: string
      enum:
        - pricing
        - quantity
        - damaged
        - not_received
        - duplicate
        - already_paid
        - other
      description: >-
        Which of these the caller is actually saying, from their own words:
        pricing for a rate or a charge they did not agree, quantity for a count
        that is wrong, damaged for goods that arrived broken, not_received for
        goods or a service that never came, duplicate for a second copy of the
        same bill, already_paid for one they say is settled. Send other for
        list.
    detail:
      type: string
      description: >-
        What the caller says is wrong, in their own terms, one short factual
        sentence. Send an empty string for list.
    amount_disputed:
      type: number
      description: >-
        How much of the invoice is being challenged, in pounds. Send 0 when the
        caller disputes the whole invoice, and 0 for list.
    confirmed:
      type: boolean
      description: >-
        True only after the caller has agreed to the summary you read back.
        Send false for list.
  required:
    - action
    - invoice_number
    - reason_code
    - detail
    - amount_disputed
    - confirmed

inject:
  - account_reference: "{{account_reference}}"

output:
  type: object
  properties:
    status:
      type: string
      enum:
        - opened
        - listed
        - not_confirmed
        - invalid_detail
        - invoice_not_found
        - already_disputed
        - account_not_found
    summary:
      type: string
    promise_cancelled:
      type: boolean
      description: >-
        True when a promise to pay was made against this invoice and has just
        come off. Say so once; the caller agreed to pay something that is now on
        hold.
    dispute:
      type: object
      description: >-
        The saved dispute, present and complete on success and absent otherwise.
        The step saves this without asking the model for it.
      properties:
        dispute_id:
          type: string
        invoice_number:
          type: string
        reason_code:
          type: string
          enum:
            - pricing
            - quantity
            - damaged
            - not_received
            - duplicate
            - already_paid
            - other
        detail:
          type: string
        amount_disputed:
          type: number
    disputes:
      type: array
      description: What the account already holds, returned by list
      items:
        type: object
        properties:
          dispute_id:
            type: string
          invoice_number:
            type: string
          reason_code:
            type: string
          detail:
            type: string
          amount_disputed:
            type: number
  required:
    - status
    - summary

local:
  handler: tools/receivables.py

interruption: provider_default
effect: returns_data
